@if (enabled) {
<div class="fixit-chrome" data-fixit-chrome>
  @if (annotationModePressed()) {
  <button
    type="button"
    class="fixit-chrome-button fixit-chrome-button-copy"
    data-testid="fixit-copy-report"
    (click)="copyReport()"
  >
    <svg aria-hidden="true" viewBox="0 0 24 24">
      <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
      <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
    </svg>
    Copy Report
  </button>
  }
  <button
    type="button"
    class="fixit-chrome-button fixit-chrome-button-icon"
    data-testid="fixit-annotation-mode-toggle"
    aria-label="Annotation Mode"
    [attr.aria-pressed]="annotationModePressed()"
    (click)="toggleAnnotationMode()"
  >
    <svg aria-hidden="true" viewBox="0 0 24 24">
      <path d="M12 20h9" />
      <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
    </svg>
  </button>
</div>
<fixit-copy-toast />
@if (targetHighlightBox(); as box) {
<div
  class="fixit-target-highlight"
  data-fixit-chrome
  data-testid="fixit-target-highlight"
  [class.fixit-target-highlight-locked]="highlightLocked()"
  [style.top]="box.top"
  [style.left]="box.left"
  [style.width]="box.width"
  [style.height]="box.height"
>
  @if (targetLabel(); as label) {
  <span class="fixit-target-label" data-testid="fixit-target-label">{{ label }}</span>
  }
</div>
} @if (draft()) { @if (noteEntryPosition(); as position) {
<fixit-note-entry
  [attr.data-placement]="position.placement"
  [style.top]="position.top"
  [style.left]="position.left"
/>
} @else {
<fixit-note-entry class="fixit-note-entry-default" />
} } @if (annotationModePressed() && hasAnnotations()) {
<fixit-annotation-list (targetHovered)="highlightAnnotationTarget($event)" />
} }
