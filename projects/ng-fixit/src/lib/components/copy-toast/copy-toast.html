<p class="fixit-copy-toast-message">Report copied</p>
<div class="fixit-copy-toast-actions">
  <button
    type="button"
    class="fixit-copy-toast-clear"
    data-testid="fixit-copy-toast-clear"
    (click)="clearAnnotations()"
  >
    Clear all
  </button>
  <button
    type="button"
    class="fixit-copy-toast-close"
    data-testid="fixit-copy-toast-close"
    aria-label="Close"
    (click)="dismiss()"
  >
    Close
  </button>
</div>
