@if (enabled) {
<div class="fixit-chrome" data-fixit-chrome>
  <button
    type="button"
    class="fixit-annotation-mode-toggle"
    data-testid="fixit-annotation-mode-toggle"
    [attr.aria-pressed]="annotationModePressed()"
    (click)="toggleAnnotationMode()"
  >
    Annotation Mode
  </button>
</div>
@if (targetHighlightBox(); as box) {
<div
  class="fixit-target-highlight"
  data-fixit-chrome
  data-testid="fixit-target-highlight"
  [style.top]="box.top"
  [style.left]="box.left"
  [style.width]="box.width"
  [style.height]="box.height"
></div>
} @if (draft()) {
<div class="fixit-note-entry" data-fixit-chrome data-testid="fixit-note-entry">
  <label class="fixit-note-entry-label" for="fixit-note-entry-input">Correction note</label>
  <textarea
    id="fixit-note-entry-input"
    class="fixit-note-entry-input"
    data-testid="fixit-note-entry-input"
    [value]="draftNote()"
    (input)="updateDraftNote($event)"
  ></textarea>
  <div class="fixit-note-entry-actions">
    <button
      type="button"
      class="fixit-note-entry-commit"
      data-testid="fixit-note-entry-commit"
      (click)="commitAnnotation()"
    >
      Commit
    </button>
    <button
      type="button"
      class="fixit-note-entry-cancel"
      data-testid="fixit-note-entry-cancel"
      (click)="cancelAnnotation()"
    >
      Cancel
    </button>
  </div>
</div>
}
<ul class="fixit-annotation-list" data-fixit-chrome data-testid="fixit-annotation-list">
  @for (annotation of annotations(); track annotation.id) {
  <li class="fixit-annotation-list-item" data-testid="fixit-annotation-list-item">
    {{ annotation.note }}
  </li>
  } @empty {
  <li class="fixit-annotation-list-empty">No Annotations yet</li>
  }
</ul>
}
