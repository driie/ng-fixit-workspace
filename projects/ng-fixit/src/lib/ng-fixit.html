@if (enabled) {
<div class="fixit-chrome" data-fixit-chrome>
  <button
    type="button"
    class="fixit-chrome-button"
    data-testid="fixit-annotation-mode-toggle"
    [attr.aria-pressed]="annotationModePressed()"
    (click)="toggleAnnotationMode()"
  >
    Annotation Mode
  </button>
  <button
    type="button"
    class="fixit-chrome-button"
    data-testid="fixit-copy-report"
    (click)="copyReport()"
  >
    Copy Report
  </button>
</div>
@if (targetHighlightBox(); as box) {
<div
  class="fixit-target-highlight"
  data-fixit-chrome
  data-testid="fixit-target-highlight"
  [style.top]="box.top"
  [style.left]="box.left"
  [style.width]="box.width"
  [style.height]="box.height"
></div>
} @if (draft()) {
<fixit-note-entry />
}
<fixit-annotation-list />
}
